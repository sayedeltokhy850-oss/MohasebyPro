<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#172554">
<title>محاسبي Pro</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,Tahoma,sans-serif;
background:#f4f6fa;
color:#172554;
}
header{
background:#172554;
color:white;
padding:16px;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
z-index:10;
}
.logo{
font-size:24px;
font-weight:bold;
}
.logo small{
display:block;
font-size:12px;
font-weight:normal;
margin-top:4px;
}
.menu-btn{
background:#fff;
color:#172554;
border:0;
border-radius:8px;
padding:10px 14px;
font-size:20px;
}
.container{
padding:15px;
max-width:1100px;
margin:auto;
}
.menu{
display:none;
background:white;
padding:10px;
border-radius:12px;
box-shadow:0 4px 15px #0002;
margin-bottom:15px;
}
.menu.show{display:block}
.menu button{
width:100%;
border:0;
background:white;
padding:13px;
text-align:right;
font-size:16px;
border-bottom:1px solid #eee;
color:#172554;
}
.menu button:last-child{border-bottom:0}
.page{display:none}
.page.active{display:block}
h2{margin-top:5px}
.cards{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}
.card{
background:white;
padding:15px;
border-radius:12px;
box-shadow:0 2px 8px #0001;
}
.card .number{
font-size:24px;
font-weight:bold;
margin-top:8px;
}
.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}
.box{
background:white;
padding:15px;
border-radius:12px;
margin-bottom:15px;
box-shadow:0 2px 8px #0001;
}
label{
display:block;
margin-bottom:6px;
font-weight:bold;
}
input,select,textarea{
width:100%;
padding:12px;
border:1px solid #ccd2dd;
border-radius:8px;
font-size:16px;
margin-bottom:12px;
background:white;
}
textarea{min-height:80px}
button{
cursor:pointer;
}
.btn{
border:0;
border-radius:8px;
padding:12px 18px;
font-size:15px;
font-weight:bold;
}
.primary{
background:#172554;
color:white;
}
.success{
background:#16a34a;
color:white;
}
.danger{
background:#dc2626;
color:white;
}
.secondary{
background:#e5e7eb;
color:#172554;
}
.actions{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:5px;
}
table{
width:100%;
border-collapse:collapse;
background:white;
}
th,td{
padding:10px;
border-bottom:1px solid #eee;
text-align:right;
}
th{
background:#eef2ff;
}
.table
