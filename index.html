<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#172554">
<title>محاسبي Pro</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:#f4f6fa;
  color:#172554
}
header{
  background:#172554;
  color:white;
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:10
}
header h1{margin:0;font-size:24px}
header small{opacity:.8}

.layout{display:flex;min-height:calc(100vh - 70px)}

aside{
  width:230px;
  background:#fff;
  border-left:1px solid #ddd;
  padding:15px;
  flex-shrink:0
}
nav button{
  width:100%;
  border:0;
  background:white;
  padding:13px 10px;
  margin:4px 0;
  border-radius:10px;
  text-align:right;
  font-size:15px;
  color:#172554;
  cursor:pointer
}
nav button:hover,nav button.active{
  background:#172554;
  color:white
}

main{
  flex:1;
  padding:20px;
  max-width:1300px;
  margin:auto;
  width:100%
}

.page{display:none}
.page.active{display:block}

h2{margin-top:0}
.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px
}
.card{
  background:white;
  padding:20px;
  border-radius:15px;
  box-shadow:0 2px 8px #0001
}
.card strong{font-size:24px;display:block;margin-top:10px}

.panel{
  background:white;
  padding:20px;
  border-radius:15px;
  margin-bottom:20px;
  box-shadow:0 2px 8px #0001
}

.form{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px
}
input,select,textarea{
  width:100%;
  padding:12px;
  border:1px solid #ccd2dd;
  border-radius:8px;
  font-size:15px
}
textarea{min-height:90px}

.btn{
  border:0;
  border-radius:8px;
  padding:11px 18px;
  cursor:pointer;
  font-size:15px;
  margin:4px
}
.primary{background:#172554;color:white}
.success{background:#198754;color:white}
.danger{background:#dc3545;color:white}
.gray{background:#e9edf3;color:#172554}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px
}
th,td{
  padding:12px 8px;
  border-bottom:1px solid #eee;
  text-align:right
}
th{background:#f1f4f8}

.actions button{padding:6px 10px}

.empty{
  text-align:center;
  padding:30px;
  color:#777
}

.mobile-menu{
