<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>محاسبي - النسخة الثانية المحسنة</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
background:#f5f7fb;
color:#172033
}

header{
background:#16213e;
color:white;
padding:15px 18px;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
position:sticky;
top:0;
z-index:20
}

header h1{
margin:0;
font-size:22px
}

header span{
font-size:13px;
opacity:.9
}

.wrap{
display:flex;
min-height:calc(100vh - 62px)
}

nav{
width:220px;
background:#fff;
border-left:1px solid #e6e9ef;
padding:12px;
flex-shrink:0
}

nav button{
width:100%;
border:0;
background:transparent;
padding:13px 10px;
text-align:right;
border-radius:8px;
cursor:pointer;
font-size:15px;
margin-bottom:4px;
color:#172033
}

nav button.active,
nav button:hover{
background:#eef2ff;
color:#243b73
}

main{
flex:1;
padding:20px;
max-width:1500px;
width:100%
}

.cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:14px;
margin-bottom:20px
}

.card{
background:white;
border:1px solid #e7eaf0;
border-radius:12px;
padding:18px;
box-shadow:0 2px 7px rgba(0,0,0,.03)
}

.card small{
color:#697386
}

.card b{
display:block;
font-size:23px;
margin-top:8px
}

.panel{
background:#fff;
border:1px solid #e7eaf0;
border-radius:12px;
padding:18px;
margin-bottom:18px;
overflow-x:auto
}

h2{
margin-top:0
}

h3{
margin-top:0
}

.row{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:10px
}

input,select{
padding:11px;
border:1px solid #d7dce5;
border-radius:7px;
min-width:150px;
background:white;
font-family:inherit;
font-size:14px;
outline:none
}

input:focus,select:focus{
border-color:#243b73
}

.btn{
border:0;
border-radius:7px;
padding:11px 16px;
cursor:pointer;
background:#243b73;
color:white;
font-family:inherit;
font-size:14px
}

.btn:hover{
opacity:.9
}

.btn.secondary{
background:#eef2ff;
color:#243b73
}

.btn.danger{
background:#b42318;
color:white
}

.btn.success{
background:#16803c;
color:white
}

.btn.warning{
background:#b7791f;
color:white
}

table{
width:100%;
border-collapse:collapse;
margin-top:14px;
min-width:650px
}

th,td{
padding:10px;
border-bottom:1px solid #eee;
text-align:right;
white-space:nowrap
}

th{
background:#f1f3f7
}

.empty{
color:#777;
padding:25px;
text-align:center
}

.total-box{
background:#eef2ff;
border-radius:10px;
padding:15px;
margin-top:15px;
font-size:18px
}

.badge{
display:inline-block;
padding:5px 9px;
border-radius:20px;
background:#eef2ff;
font-size:12px
}

.badge.danger{
background:#fee4e2;
color:#b42318
}

.badge.success{
background:#dcfae6;
color:#16803c
}

.search{
width:100%;
margin-bottom:12px
}

.notice{
padding:12px;
border-radius:8px;
background:#fff8e1;
border:1px solid #f4df9b;
margin-bottom:15px
}

.low-stock{
background:#fff4f4
}

.actions{
display:flex;
gap:6px;
flex-wrap:wrap
}

.stat-positive{
color:#16803c
}

.stat-negative{
color:#b42318
}

@media(max-width:1000px){

.cards{
grid-template-columns:repeat(2,1fr)
}

}

@media(max-width:800px){

header{
padding:13px
}

header h1{
font-size:19px
}

.wrap{
display:block
}

nav{
width:100%;
display:flex;
overflow-x:auto;
gap:5px;
padding:8px;
position:sticky;
top:61px;
z-index:10;
border-bottom:1px solid #e6e9ef;
border-left:0
}

nav button{
min-width:max-content;
width:auto;
font-size:13px;
padding:10px 12px;
margin:0
}

main{
padding:10px
}

.cards{
grid-template-columns:repeat(2,1fr);
gap:8px
}

.card{
padding:13px
}

.card b{
font-size:18px
}

.panel{
padding:13px
}

.row{
flex-direction:column
}

input,select,
.row .btn{
width:100%;
min-width:0
}

table{
font-size:12px
}

}

@media(max-width:430px){

.cards{
grid-template-columns:1fr 1fr
}

.card small{
font-size:11px
}

.card b{
font-size:16px
}

}
</style>
</head>

<body>

<header>
<h1>📒 محاسبي</h1>
<span>النسخة الثانية المحسنة</span>
</header>

<div class="wrap">

<nav id="nav"></nav>

<main id="app"></main>

</div>

<script>

/* =========================================================
   البيانات
========================================================= */

const state={

section:"dashboard",

customers:JSON.parse(localStorage.getItem("customers")||"[]"),

suppliers:JSON.parse(localStorage.getItem("suppliers")||"[]"),

items:JSON.parse(localStorage.getItem("items")||"[]"),

sales:JSON.parse(localStorage.getItem("sales")||"[]"),

purchases:JSON.parse(localStorage.getItem("purchases")||"[]"),

expenses:JSON.parse(localStorage.getItem("expenses")||"[]")

};


/* =========================================================
   الحفظ
========================================================= */

function save(){

localStorage.setItem(
"customers",
JSON.stringify(state.customers)
);

localStorage.setItem(
"suppliers",
JSON.stringify(state.suppliers)
);

localStorage.setItem(
"items",
JSON.stringify(state.items)
);

localStorage.setItem(
"sales",
JSON.stringify(state.sales)
);

localStorage.setItem(
"purchases",
JSON.stringify(state.purchases)
);

localStorage.setItem(
"expenses",
JSON.stringify(state.expenses)
);

}


/* =========================================================
   القوائم
========================================================= */

const menus=[

["dashboard","🏠 لوحة التحكم"],

["customers","👥 العملاء"],

["suppliers","🚚 الموردون"],

["items","📦 الأصناف"],

["sales","💰 المبيعات"],

["purchases","🛒 المشتريات"],

["expenses","💸 المصروفات"],

["reports","📊 التقارير"],

["backup","💾 النسخ الاحتياطي"]

];


function nav(){

document.getElementById("nav").innerHTML=

menus.map(x=>`

<button
class="${state.section===x[0]?"active":""}"
onclick="go('${x[0]}')">

${x[1]}

</button>

`).join("");

}


function go(section){

state.section=section;

render();

}


/* =========================================================
   أدوات عامة
========================================================= */

function money(value){

return Number(value||0).toFixed(2);

}


function today(){

return new Date().toLocaleDateString("ar-EG");

}


function number(value){

return Number(value)||0;

}


/* =========================================================
   لوحة التحكم
========================================================= */

function dashboard(){

let sales=state.sales.reduce(
(a,x)=>a+number(x.total),0
);

let purchases=state.purchases.reduce(
(a,x)=>a+number(x.total),0
);

let expenses=state.expenses.reduce(
(a,x)=>a+number(x.amount),0
);

let costOfSales=state.sales.reduce(
(a,x)=>a+number(x.costTotal),0
);

let grossProfit=sales-costOfSales;

let netProfit=grossProfit-expenses;

let lowStock=state.items.filter(
x=>number(x.qty)<=number(x.minQty||0)
);

return `

<h2>لوحة التحكم</h2>

<div class="cards">

<div class="card">
<small>عدد العملاء</small>
<b>${state.customers.length}</b>
</div>

<div class="card">
<small>عدد الموردين</small>
<b>${state.suppliers.length}</b>
</div>

<div class="card">
<small>عدد الأصناف</small>
<b>${state.items.length}</b>
</div>

<div class="card">
<small>قيمة المخزون</small>
<b>${money(stockValue())}</b>
</div>

<div class="card">
<small>إجمالي المبيعات</small>
<b>${money(sales)}</b>
</div>

<div class="card">
<small>تكلفة المبيعات</small>
<b>${money(costOfSales)}</b>
</div>

<div class="card">
<small>المصروفات</small>
<b>${money(expenses)}</b>
</div>

<div class="card">
<small>صافي الربح</small>
<b class="${netProfit>=0?"stat-positive":"stat-negative"}">
${money(netProfit)}
</b>
</div>

</div>

${lowStock.length?`

<div class="notice">

<b>⚠️ تنبيه المخزون</b>

<br>

يوجد ${lowStock.length} صنف يحتاج إلى مراجعة الكمية.

</div>

`:""}

<div class="panel">

<h3>نظرة سريعة</h3>

<p>
تاريخ اليوم:
<b>${today()}</b>
</p>

<p>
عدد فواتير المبيعات:
<b>${state.sales.length}</b>
</p>

<p>
عدد فواتير المشتريات:
<b>${state.purchases.length}</b>
</p>

<p>
عدد المصروفات:
<b>${state.expenses.length}</b>
</p>

<p>
إجمالي قيمة المخزون:
<b>${money(stockValue())}</b>
</p>

</div>

`;

}


/* =========================================================
   العملاء
========================================================= */

function customers(){

return `

<h2>العملاء</h2>

<div class="panel">

<div class="row">

<input
id="customerName"
placeholder="اسم العميل">

<input
id="customerPhone"
placeholder="رقم الهاتف">

<input
id="customerAddress"
placeholder="العنوان">

<button
class="btn"
onclick="addCustomer()">

إضافة عميل

</button>

</div>

</div>

<div class="panel">

<input
class="search"
id="customerSearch"
placeholder="🔎 البحث عن عميل..."
oninput="filterCustomers()">

<div id="customerTable">

${customerTable()}

</div>

</div>

`;

}


function customerTable(){

return `

<table>

<thead>

<tr>

<th>#</th>
<th>الاسم</th>
<th>الهاتف</th>
<th>العنوان</th>
<th>حذف</th>

</tr>

</thead>

<tbody>

${state.customers.map((x,i)=>`

<tr>

<td>${i+1}</td>

<td>${x.name||""}</td>

<td>${x.phone||""}</td>

<td>${x.address||""}</td>

<td>

<button
class="btn danger"
onclick="deleteCustomer(${i})">

حذف

</button>

</td>

</tr>

`).join("")||

`<tr>
<td colspan="5" class="empty">
لا يوجد عملاء
</td>
</tr>`

}

</tbody>

</table>

`;

}


function filterCustomers(){

let q=document.getElementById("customerSearch").value
.toLowerCase();

let rows=state.customers.filter(x=>
String(x.name||"").toLowerCase().includes(q)||
String(x.phone||"").toLowerCase().includes(q)
);

document.getElementById("customerTable").innerHTML=`

<table>

<thead>

<tr>
<th>#</th>
<th>الاسم</th>
<th>الهاتف</th>
<th>العنوان</th>
<th>حذف</th>
</tr>

</thead>

<tbody>

${rows.map(x=>{

let i=state.customers.indexOf(x);

return `

<tr>

<td>${i+1}</td>
<td>${x.name||""}</td>
<td>${x.phone||""}</td>
<td>${x.address||""}</td>

<td>
<button
class="btn danger"
onclick="deleteCustomer(${i})">
حذف
</button>
</td>

</tr>

`;

}).join("")||

`<tr>
<td colspan="5" class="empty">
لا توجد نتائج
</td>
</tr>`

}

</tbody>

</table>

`;

}


function addCustomer(){

let name=document.getElementById("customerName").value.trim();

let phone=document.getElementById("customerPhone").value.trim();

let address=document.getElementById("customerAddress").value.trim();

if(!name){

alert("اكتب اسم العميل");

return;

}

state.customers.push({

name,
phone,
address

});

save();

render();

}


function deleteCustomer(i){

if(confirm("هل تريد حذف العميل؟")){

state.customers.splice(i,1);

save();

render();

}

}


/* =========================================================
   الموردون
========================================================= */

function suppliers(){

return `

<h2>الموردون</h2>

<div class="panel">

<div class="row">

<input
id="supplierName"
placeholder="اسم المورد">

<input
id="supplierPhone"
placeholder="رقم الهاتف">

<input
id="supplierAddress"
placeholder="العنوان">

<button
class="btn"
onclick="addSupplier()">

إضافة مورد

</button>

</div>

</div>

<div class="panel">

<input
class="search"
id="supplierSearch"
placeholder="🔎 البحث عن مورد..."
oninput="filterSuppliers()">

<div id="supplierTable">

${supplierTable()}

</div>

</div>

`;

}


function supplierTable(){

return `

<table>

<thead>

<th>#</th>
<th>الاسم</th>
<th>الهاتف</th>
<th>العنوان</th>
<th>حذف</th>

</thead>

<tbody>

${state.suppliers.map((x,i)=>`

<tr>

<td>${i+1}</td>

<td>${x.name||""}</td>

<td>${x.address||""}</td>

<td>

<button
class="btn danger"
onclick="deleteSupplier(${i})">

حذف

</button>

</td>

</tr>

`).join("")||

`<tr>
<td colspan="5" class="empty">

</td>
</tr>`

</tbody>

</table>

`;

}


function filterSuppliers(){

let q=document.getElementById("supplierSearch").value
.toLowerCase();

let rows=state.suppliers.filter(x=>
String(x.name||"").toLowerCase().includes(q)||
String(x.phone||"").toLowerCase().includes(q)
);

document.getElementById("supplierTable").innerHTML=`

<table>

<thead>

<tr>
<th>#</th>
<th>الاسم</th>
<th>الهاتف</th>
<th>العنوان</th>
<th>حذف</th>
</tr>

</thead>

<tbody>

${rows.map(x=>{

let i=state.suppliers.indexOf(x);

return `

<tr>

<td>${i+1}</td>
<td>${x.name||""}</td>
<td>${x.phone||""}</td>
<td>${x.address||""}</td>

<td>

<button
class="btn danger"
onclick="deleteSupplier(${i})">
حذف
</button>

</td>

</tr>

`;

}).join("")||

`<tr>
<td colspan="5" class="empty">
لا توجد نتائج
</td>
</tr>`

}

</tbody>

</table>

`;

}


function addSupplier(){

let name=document.getElementById("supplierName").value.trim();

let phone=document.getElementById("supplierPhone").value.trim();

let address=document.getElementById("supplierAddress").value.trim();

if(!name){

alert("اكتب اسم المورد");

return;

}

state.suppliers.push({

name,
phone,
address

});

save();

render();

}


function deleteSupplier(i){

if(confirm("هل تريد حذف المورد؟")){

state.suppliers.splice(i,1);

save();

render();

}

}


/* =========================================================
   الأصناف والمخزون
========================================================= */

function items(){

return `

<h2>الأصناف والمخزون</h2>

<div class="panel">

<div class="row">

<input
id="itemName"
placeholder="اسم الصنف">

<input
id="itemCode"
placeholder="كود الصنف">

<input
id="itemPrice"
type="number"
min="0"
placeholder="سعر البيع">

<input
id="itemPurchase"
type="number"
min="0"
placeholder="سعر الشراء">

<input
id="itemQty"
type="number"
min="0"
placeholder="الكمية الحالية">

<input
id="itemMinQty"
type="number"
min="0"
placeholder="حد التنبيه">

<button
class="btn"
onclick="addItem()">

إضافة صنف

</button>

</div>

</div>

<div class="panel">

<input
class="search"
id="itemSearch"
placeholder="🔎 البحث عن صنف أو كود..."
oninput="filterItems()">

<div id="itemTable">

${itemTable()}

</div>

</div>

`;

}


function itemTable(){

return `

<table>

<thead>

<tr>

<th>#</th>
<th>الكود</th>
<th>الصنف</th>
<th>سعر البيع</th>
<th>سعر الشراء</th>
<th>الكمية</th>
<th>القيمة</th>
<th>الحالة</th>
<th>حذف</th>

</tr>

</thead>

<tbody>

${state.items.map((x,i)=>`

<tr class="${number(x.qty)<=number(x.minQty||0)?"low-stock":""}">

<td>${i+1}</td>

<td>${x.code||""}</td>

<td>${x.name||""}</td>

<td>${money(x.price)}</td>

<td>${money(x.purchase)}</td>

<td>${number(x.qty)}</td>

<td>${money(number(x.qty)*number(x.purchase))}</td>

<td>

${
number(x.qty)<=number(x.minQty||0)
?
`<span class="badge danger">مخزون منخفض</span>`
:
`<span class="badge success">جيد</span>`
}

</td>

<td>

<button
class="btn danger"
onclick="deleteItem(${i})">

حذف

</button>

</td>

</tr>

`).join("")||

`<tr>
<td colspan="9" class="empty">
لا توجد أصناف
</td>
</tr>`

}

</tbody>

</table>

`;

}


function filterItems(){

let q=document.getElementById("itemSearch").value
.toLowerCase();

let rows=state.items.filter(x=>
String(x.name||"").toLowerCase().includes(q)||
String(x.code||"").toLowerCase().includes(q)
);

document.getElementById("itemTable").innerHTML=`

<table>

<thead>

<tr>

<th>#</th>
<th>الكود</th>
<th>الصنف</th>
<th>سعر البيع</th>
<th>سعر الشراء</th>
<th>الكمية</th>
<th>القيمة</th>
<th>الحالة</th>
<th>حذف</th>

</tr>

</thead>

<tbody>

${rows.map(x=>{

let i=state.items.indexOf(x);

return `

<tr>

<td>${i+1}</td>

<td>${x.code||""}</td>

<td>${x.name||""}</td>

<td>${money(x.price)}</td>

<td>${money(x.purchase)}</td>

<td>${number(x.qty)}</td>

<td>${money(number(x.qty)*number(x.purchase))}</td>

<td>

${
number(x.qty)<=number(x.minQty||0)
?
`<span class="badge danger">مخزون منخفض</span>`
:
`<span class="badge success">جيد</span>`
}

</td>

<td>

<button
class="btn danger"
onclick="deleteItem(${i})">
حذف
</button>

</td>

</tr>

`;

}).join("")||

`<tr>
<td colspan="9" class="empty">
لا توجد نتائج
</td>
</tr>`

}

</tbody>

</table>

`;

}


function addItem(){

let name=document.getElementById("itemName").value.trim();

let code=document.getElementById("itemCode").value.trim();

let price=number(
document.getElementById("itemPrice").value
);

let purchase=number(
document.getElementById("itemPurchase").value
);

let qty=number(
document.getElementById("itemQty").value
);

let minQty=number(
document.getElementById("itemMinQty").value
);

if(!name){

alert("اكتب اسم الصنف");

return;

}

if(price<0||purchase<0||qty<0){

alert("تأكد من الأسعار والكميات");

return;

}

state.items.push({

name,
code,
price,
purchase,
qty,
minQty

});

save();

render();

}


function deleteItem(i){

if(confirm("هل تريد حذف الصنف؟")){

state.items.splice(i,1);

save();

render();

}

}


function stockValue(){

return state.items.reduce(

(total,item)=>

total+
(number(item.qty)*number(item.purchase
