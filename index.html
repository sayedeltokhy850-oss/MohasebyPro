<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>محاسبي - النسخة الأولى</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#16213e;color:white;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:22px}.wrap{display:flex;min-height:calc(100vh - 68px)}
nav{width:220px;background:#fff;border-left:1px solid #e6e9ef;padding:14px}
nav button{width:100%;border:0;background:transparent;padding:13px;text-align:right;border-radius:8px;cursor:pointer;font-size:15px;margin-bottom:4px}
nav button.active,nav button:hover{background:#eef2ff}
main{flex:1;padding:22px;max-width:1250px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.card{background:white;border:1px solid #e7eaf0;border-radius:12px;padding:18px}.card small{color:#697386}.card b{display:block;font-size:25px;margin-top:8px}
.panel{background:#fff;border:1px solid #e7eaf0;border-radius:12px;padding:18px;margin-bottom:18px}
h2{margin-top:0}.row{display:flex;gap:10px;flex-wrap:wrap}
input,select{padding:11px;border:1px solid #d7dce5;border-radius:7px;min-width:160px}
.btn{border:0;border-radius:7px;padding:11px 16px;cursor:pointer;background:#243b73;color:white}
.btn.secondary{background:#eef2ff;color:#243b73}
table{width:100%;border-collapse:collapse;margin-top:14px}th,td{padding:11px;border-bottom:1px solid #eee;text-align:right}
.empty{color:#777;padding:25px;text-align:center}
@media(max-width:800px){nav{width:72px}nav button{font-size:0;text-align:center}nav button:before{content:"•";font-size:24px}.cards{grid-template-columns:repeat(2,1fr)}main{padding:12px}}
</style>
</head>
<body>
<header><h1>محاسبي</h1><span>النسخة الأولى</span></header>
<div class="wrap">
<nav id="nav"></nav>
<main id="app"></main>
</div>
<script>
const state={section:'dashboard',customers:JSON.parse(localStorage.getItem('customers')||'[]'),suppliers:JSON.parse(localStorage.getItem('suppliers')||'[]'),items:JSON.parse(localStorage.getItem('items')||'[]'),sales:JSON.parse(localStorage.getItem('sales')||'[]'),purchases:JSON.parse(localStorage.getItem('purchases')||'[]')};
const menus=[['dashboard','لوحة التحكم'],['customers','العملاء'],['suppliers','الموردون'],['items','الأصناف'],['sales','المبيعات'],['purchases','المشتريات']];
function save(){localStorage.setItem('customers',JSON.stringify(state.customers));localStorage.setItem('suppliers',JSON.stringify(state.suppliers));localStorage.setItem('items',JSON.stringify(state.items));localStorage.setItem('sales',JSON.stringify(state.sales));localStorage.setItem('purchases',JSON.stringify(state.purchases))}
function nav(){document.getElementById('nav').innerHTML=menus.map(x=>`<button class="${state.section==x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
function go(s){state.section=s;render()}
function dashboard(){let sales=state.sales.reduce((a,x)=>a+Number(x.total||0),0), purchases=state.purchases.reduce((a,x)=>a+Number(x.total||0),0);return `<h2>لوحة التحكم</h2><div class="cards"><div class="card"><small>العملاء</small><b>${state.customers.length}</b></div><div class="card"><small>الموردون</small><b>${state.suppliers.length}</b></div><div class="card"><small>إجمالي المبيعات</small><b>${sales.toFixed(2)}</b></div><div class="card"><small>صافي المبيعات - المشتريات</small><b>${(sales-purchases).toFixed(2)}</b></div></div><div class="panel"><h2>نظرة سريعة</h2><p>هذه نسخة أولية تعمل محليًا على جهازك. البيانات تُحفظ في المتصفح.</p><p>الخطوة التالية: إضافة الفواتير التفصيلية، القيود اليومية، المخزون، التقارير، المستخدمين والنسخ الاحتياطي.</p></div>`}
const labels={customers:['العملاء','اسم العميل','رقم الهاتف'],suppliers:['الموردون','اسم المورد','رقم الهاتف'],items:['الأصناف','اسم الصنف','السعر']};
function master(type){let [title,a,b]=labels[type];let arr=state[type];return `<h2>${title}</h2><div class="panel"><div class="row"><input id="n" placeholder="${a}"><input id="v" placeholder="${b}"><button class="btn" onclick="addMaster('${type}')">إضافة</button></div></div><div class="panel"><table><thead><tr><th>#</th><th>${a}</th><th>${b}</th><th>حذف</th></tr></thead><tbody>${arr.map((x,i)=>`<tr><td>${i+1}</td><td>${x.name}</td><td>${x.value}</td><td><button class="btn secondary" onclick="delMaster('${type}',${i})">حذف</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">لا توجد بيانات</td></tr>'}</tbody></table></div>`}
function addMaster(type){let n=document.getElementById('n').value.trim(),v=document.getElementById('v').value.trim();if(!n)return alert('اكتب الاسم أولًا');state[type].push({name:n,value:v});save();render()}
function delMaster(type,i){state[type].splice(i,1);save();render()}
function transactions(type){let isSale=type==='sales',title=isSale?'المبيعات':'المشتريات';let arr=state[type];return `<h2>${title}</h2><div class="panel"><div class="row"><input id="tn" placeholder="${isSale?'اسم العميل':'اسم المورد'}"><input id="tt" type="number" placeholder="الإجمالي"><button class="btn" onclick="addTx('${type}')">حفظ العملية</button></div></div><div class="panel"><table><thead><tr><th>#</th><th>الطرف</th><th>الإجمالي</th><th>التاريخ</th></tr></thead><tbody>${arr.map((x,i)=>`<tr><td>${i+1}</td><td>${x.name}</td><td>${Number(x.total).toFixed(2)}</td><td>${x.date}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">لا توجد عمليات</td></tr>'}</tbody></table></div>`}
function addTx(type){let n=document.getElementById('tn').value.trim(),t=Number(document.getElementById('tt').value);if(!n||!t)return alert('أدخل الطرف والإجمالي');state[type].push({name:n,total:t,date:new Date().toLocaleDateString('ar-EG')});save();render()}
function render(){nav();let s=state.section;document.getElementById('app').innerHTML=s==='dashboard'?dashboard():['customers','suppliers','items'].includes(s)?master(s):transactions(s)}
render();
</script>
</body>
</html>
